[package]
name = "nanocode-tui"
autotests = false
autobenches = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors = ["Nanocodex Contributors", "Ben Clabby"]
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Terminal UI components for Nanocodex hosts, derived from clabby/tact"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events", "event-stream", "osc52"] }
pulldown-cmark = { version = "0.13.0", default-features = false }
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
serde.workspace = true
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-onig"] }
tracing.workspace = true
unicode-segmentation = "1.13"
unicode-width = "0.2"

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
